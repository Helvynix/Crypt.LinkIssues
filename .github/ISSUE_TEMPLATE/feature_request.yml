name: Feature request
description: Suggest a feature to add to this application.
title: "Feature request: "
labels: ["enhancement"]
type: "Enhancement"
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the solution you'd like 🧐
      description: Add any other context or screenshots about the feature request here.
      placeholder: A clear and concise description of what you want to happen. (e.g. Make the tunnel resistant to earth quakes)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra information and references
      placeholder: |
        A clear and concise description of any alternative solutions or features you've considered.
        Add any other context or screenshots about the feature request here.